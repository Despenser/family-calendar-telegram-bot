# Конфигурация nginx для Telegram Webhook с HTTPS
# Используется для проксирования HTTPS запросов от Telegram к Spring Boot приложению

# Оптимизация производительности
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    # Базовые настройки
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    
    # ВАЖНО: Разрешаем заголовки с подчеркиваниями (для X-Telegram-Bot-Api-Secret-Token)
    underscores_in_headers on;
    
    # Rate limiting для webhook endpoint
    # 20 запросов в секунду на IP (Telegram обычно шлет ~1-2 rps)
    limit_req_zone $binary_remote_addr zone=webhook_limit:10m rate=20r/s;
    
    # Оптимизация
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;
    
    # Логирование
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    
    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;
    
    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript 
               application/json application/javascript application/xml+rss 
               application/rss+xml font/truetype font/opentype 
               application/vnd.ms-fontobject image/svg+xml;
    
    # Upstream для Spring Boot приложения
    upstream telegram_bot {
        server app:8080;
        keepalive 32;
    }
    
    # HTTPS сервер для Telegram Webhook
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        
        server_name _;
        
        # SSL сертификаты
        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        
        # SSL настройки безопасности
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        
        # SSL оптимизация
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_session_tickets off;
        
        # Безопасность заголовков
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        
        # Webhook endpoint для Telegram
        location /webhook {
            # Rate limiting для защиты от flood атак
            limit_req zone=webhook_limit burst=10 nodelay;
            limit_req_status 429;
            
            # Безопасность обеспечивается через secret_token в приложении
            # IP фильтрация Telegram (актуальные диапазоны на 2026)
            # Источник: https://core.telegram.org/bots/webhooks#the-short-version
            allow 149.154.160.0/20;
            allow 91.108.4.0/22;
            deny all;
            
            # Проксирование к Spring Boot приложению
            proxy_pass http://telegram_bot;
            
            # Заголовки для проксирования
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Передаем secret token от Telegram (nginx преобразует дефисы в подчеркивания)
            proxy_set_header X-Telegram-Bot-Api-Secret-Token $http_x_telegram_bot_api_secret_token;
            
            # Таймауты
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
            
            # Буферизация
            proxy_buffering off;
            proxy_request_buffering off;
            
            # HTTP версия для upstream
            proxy_http_version 1.1;
            proxy_set_header Connection "";
        }
        
        # Health check endpoint (доступен без ограничений)
        location /actuator/health {
            proxy_pass http://telegram_bot;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            access_log off;
        }
        
        # Запрет доступа к остальным endpoints
        location / {
            return 404;
        }
    }
}
