spring:
  application:
    name: family-calendar-bot
  
  # Конфигурация планировщиков
  task:
    scheduling:
      pool:
        size: 2
  
  # Конфигурация источника данных PostgreSQL
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/family_calendar}
    username: ${SPRING_DATASOURCE_USERNAME:botuser}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Настройки пула соединений
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  # Конфигурация JPA и Hibernate
  jpa:
    # Явно отключаем Open Session In View для предотвращения ленивой загрузки в слое представления
    open-in-view: false
    hibernate:
      # validate - проверяет схему БД, но не изменяет её (миграции через Flyway)
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        # Dialect определяется автоматически на основе JDBC URL
        # Оптимизация производительности
        jdbc:
          batch_size: 20
        order_inserts: true
        order_updates: true
        # Кэширование второго уровня (опционально)
        cache:
          use_second_level_cache: false
  
  # Конфигурация Flyway для миграций БД
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    validate-on-migrate: true
    # Создать схему, если её нет
    create-schemas: true
    # Схема по умолчанию
    default-schema: public

  # Конфигурация GigaChat AI
  ai:
    gigachat:
      auth:
        bearer:
          api-key: ${GIGACHAT_API_KEY}
        scope: ${GIGACHAT_API_SCOPE:GIGACHAT_API_PERS}
        unsafe-ssl: true
      chat:
        options:
          model: ${GIGACHAT_MODEL:GigaChat-Max}
          temperature: ${GIGACHAT_TEMPERATURE:0.3}
          max-tokens: ${GIGACHAT_MAX_TOKENS:1024}

# Конфигурация Telegram бота
telegram:
  bot:
    token: ${TELEGRAM_BOT_TOKEN}
    username: ${TELEGRAM_BOT_USERNAME:FamilyCalendarBot}
    webhook-url: ${TELEGRAM_BOT_WEBHOOK_URL}

# Конфигурация логирования (базовые настройки, переопределяются в logback-spring.xml)
logging:
  level:
    root: INFO
    ru.golubyatnikov.family.calendar.bot: DEBUG
    org.springframework.web: DEBUG
    org.springframework.data: INFO
    org.hibernate.SQL: INFO
    org.flywaydb: INFO
    chat.giga.springai: DEBUG
  file:
    name: logs/family-calendar-bot.log

# Настройки сервера
server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/xml,text/plain
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: on_param
    include-exception: false

# Настройки управления и мониторинга (Spring Boot Actuator)
management:
  endpoints:
    web:
      exposure:
        # Включаем endpoints для мониторинга
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
    metrics:
      enabled: true
  metrics:
    # Включаем экспорт метрик
    export:
      simple:
        enabled: true
    # Настройки тегов для метрик
    tags:
      application: ${spring.application.name}
    # Включаем распределение для таймеров (percentiles)
    distribution:
      percentiles-histogram:
        authorization.check.duration.seconds: true
      percentiles:
        authorization.check.duration.seconds: 0.5, 0.95, 0.99

# Конфигурация приложения
app:
  # Настройки планировщиков
  scheduler:
    # Cron выражение для очистки корзины (по умолчанию: каждый день в 2:00)
    trash-cleanup-cron: "0 0 2 * * ?"
    # Интервал проверки напоминаний в миллисекундах (60000 = 1 минута)
    reminder-check-interval: 60000
    # Интервал завершения событий в миллисекундах (600000 = 10 минут)
    event-completion-interval: 600000

  # Настройки корзины
  trash:
    # Количество дней хранения событий в корзине
    retention-days: 30

  # Настройки файлов
  file:
    # Максимальный размер файла в байтах (20 МБ)
    max-size-bytes: 20971520

  # Настройки уведомлений о напоминаниях
  reminder-notification:
    # Окно проверки напоминаний в часах
    window-hours: 1
    # Порог для старых напоминаний в часах
    old-threshold-hours: 1

  # Настройки поиска
  search:
    # Минимальная длина поискового запроса
    min-query-length: 2

  # Настройки выбора времени в UI
  time-selection:
    # Максимальный час для выбора времени
    max-hour: 23
    # Пороговая минута для отсечки
    cutoff-minute: 46
    # Количество часов в одном ряду клавиатуры
    hours-per-row: 4

  # Настройки webhook
  webhook:
    # Длина секретного токена
    secret-token-length: 64

  # Настройки форматирования дат и времени
  datetime-format:
    # Формат даты
    date-pattern: "dd.MM.yyyy"
    # Формат времени
    time-pattern: "HH:mm"
    # Формат даты и времени
    date-time-pattern: "dd.MM.yyyy HH:mm"
    # Формат короткой даты с днем недели
    short-date-pattern: "dd.MM (EEEE)"
    # Формат месяца
    month-pattern: "LLLL yyyy"
    # Формат короткой даты без года
    short-date-without-year-pattern: "dd.MM"
    # Формат дня недели
    day-of-week-pattern: "EEEE"
    # Формат даты с днем недели
    date-with-day-of-week-pattern: "dd.MM.yyyy - EEEE"
    # Локаль для форматирования
    locale: "ru"
    # Часовой пояс по умолчанию
    default-timezone: "Europe/Moscow"

  # Настройки HTTP заголовков
  http-headers:
    # Имя заголовка для correlation ID
    correlation-id-header: "X-Correlation-ID"

  # Настройки Telegram API
  telegram-api:
    # Базовый URL Telegram Bot API
    base-url: "https://api.telegram.org"
    # Путь для установки webhook
    set-webhook-path: "/bot%s/setWebhook"
    # Имя заголовка для secret token
    secret-token-header: "X-Telegram-Bot-Api-Secret-Token"

  # Настройки retry для API вызовов
  retry:
    # Максимальное количество попыток
    max-attempts: 3
    # Начальная задержка между попытками в миллисекундах
    initial-delay: 1000
    # Множитель для увеличения задержки
    multiplier: 2.0

  # Конфигурация системы напоминаний
  reminder:
    # Настройки автоматических напоминаний по умолчанию
    defaults:
      # Включить/выключить автоматическое создание напоминаний при создании события
      enabled: true
      # Список типов напоминаний, создаваемых автоматически
      # Доступные типы: MORNING_OF_DAY, EVENING_BEFORE, ONE_HOUR_BEFORE, FIFTEEN_MINUTES_BEFORE, CUSTOM
      types:
        - EVENING_BEFORE
        - ONE_HOUR_BEFORE
        - FIFTEEN_MINUTES_BEFORE
    scheduler:
      # Включить/выключить планировщик напоминаний
      enabled: true
      # Интервал проверки напоминаний в миллисекундах (60000 = 1 минута)
      fixed-rate: 60000
    # Максимальное количество напоминаний на одно событие
    max-per-event: 10
    # Максимальное количество минут для custom напоминания (43200 = 30 дней)
    max-custom-minutes: 43200

  # Конфигурация очистки черновиков событий
  draft:
    cleanup:
      # Включить/выключить автоматическую очистку осиротевших черновиков
      enabled: true
      # Пороговое значение для очистки при запуске приложения (в часах)
      # Черновики старше этого значения будут удалены при старте
      startup-threshold-hours: 1
      # Пороговое значение для периодической очистки (в часах)
      # Черновики старше этого значения будут удалены при периодической очистке
      periodic-threshold-hours: 24
      # Расписание периодической очистки в формате cron (по умолчанию каждые 6 часов)
      # Формат: секунды минуты часы день месяц день_недели
      # 0 0 */6 * * * = каждые 6 часов в 00 минут 00 секунд
      schedule-cron: "0 0 */6 * * *"

  # Конфигурация сообщений для неавторизованных пользователей
  bot-messages:
    unauthorized:
      # Инструкция по получению доступа
      contact-admin: "Для получения доступа обратитесь к администратору вашей семьи."
      # Шаблоны сообщений для разных категорий
      # Поддерживаются параметры: {command}, {feature}
      templates:
        event-creation: "Создание событий доступно только зарегистрированным пользователям семейного календаря."
        event-viewing: "Просмотр событий доступен только членам семейного календаря."
        event-management: "Управление событиями доступно только зарегистрированным пользователям."
        search-filter: "Поиск и фильтрация событий доступны только членам семейного календаря."
        trash-management: "Управление корзиной доступно только зарегистрированным пользователям."
        statistics: "Просмотр статистики доступен только членам семейного календаря."
        general: "Эта функция доступна только зарегистрированным пользователям семейного календаря."

  # Конфигурация кэширования Caffeine
  cache:
    # Максимальное количество записей в кэше
    maximum-size: 1000
    # Время жизни записи после создания/обновления (в минутах)
    expire-after-write-minutes: 60
    # Время жизни записи после последнего доступа (в минутах)
    expire-after-access-minutes: 30
    # Список имен кэшей
    names:
      - upcomingEvents  # Кэш предстоящих событий семьи (ключ: familyId_days_zoneId)
      - userEvents      # Кэш событий пользователя (ключ: userId_ACTIVE)
      - myEventsPage    # Кэш постраничного списка событий (ключ: userId_page_size)

  # Конфигурация постраничного списка событий
  my-events:
    # Размер страницы по умолчанию
    page-size: 10
    # Максимальная длина названия события в кнопке
    max-title-length: 25

  # Конфигурация парсинга событий через AI
  event-parsing:
    # Время жизни сессии парсинга в минутах
    session-timeout-minutes: 30
    # Интервал очистки устаревших сессий в миллисекундах (600000 = 10 минут)
    cleanup-interval-ms: 600000
    # Максимальное количество сообщений в истории диалога
    max-conversation-history-size: 10
    # Системный промпт для агента-парсера
    parser-system-prompt: |
      Ты - ассистент для извлечения информации о событиях календаря из текста пользователя.
      
      ВАЖНО: Твоя единственная задача - извлечь из текста пользователя три параметра:
      1. Название события (что планируется)
      2. Дата события (когда)
      3. Время события (во сколько)
      
      Правила извлечения данных:
      - Дата должна быть в формате dd.MM.yyyy
      - Время должно быть в формате HH:mm (24-часовой формат)
      - Преобразуй относительные даты используя справочник ниже
      - Время "два часа дня" = 14:00, "три часа дня" = 15:00, и т.д.
      - Время "утра" = 0-11 часов, "вечера" = 12-23 часа
      
      Справочник дат (используй ТОЧНО эти даты):
      - "сегодня" = %s
      - "завтра" = %s
      - "послезавтра" = %s
      - "в понедельник" или "понедельник" = %s
      - "во вторник" или "вторник" = %s
      - "в среду" или "среда" = %s
      - "в четверг" или "четверг" = %s
      - "в пятницу" или "пятница" = %s
      - "в субботу" или "суббота" = %s
      - "в воскресенье" или "воскресенье" = %s
      
      КРИТИЧЕСКИ ВАЖНО:
      - Используй ТОЛЬКО даты из справочника выше!
      - Если дата НЕ указана явно - НЕ подставляй текущую дату автоматически!
      - Если время НЕ указано - НЕ подставляй время автоматически!
      - Если название события неясно - НЕ придумывай его!
      
      Формат ответа (строго придерживайся этого формата):
      
      Если ВСЕ данные извлечены:
      Название: [извлеченное название]
      Дата: [дата в формате dd.MM.yyyy]
      Время: [время в формате HH:mm]
      
      Если ЛЮБЫЕ данные отсутствуют:
      Недостающие данные: [список того, что нужно уточнить: дата/время/название]
      Вопрос: [конкретный вопрос для уточнения недостающих данных]
      
      НЕ веди общий диалог, НЕ обсуждай другие темы. Только извлекай данные о событии или задавай уточняющие вопросы.

    # Системный промпт для агента-валидатора (Judge)
    judge-system-prompt: |
      Ты - валидатор извлеченных данных о событии календаря.
      Твоя задача - проверить корректность и полноту данных, извлеченных другим агентом.
      
      Проверь:
      1. Наличие всех обязательных полей: название, дата, время
      2. Корректность формата даты (dd.MM.yyyy)
      3. Корректность формата времени (HH:mm)
      4. Дата не должна быть в прошлом
      5. Название события не должно быть пустым
      
      Верни ТОЛЬКО JSON (без дополнительного текста) с результатом валидации:
      {
        "valid": true/false,
        "title": "название события или null",
        "date": "дата в формате dd.MM.yyyy или null",
        "time": "время в формате HH:mm или null",
        "missingFields": ["список недостающих полей"],
        "errors": ["список ошибок валидации"],
        "clarificationQuestion": "вопрос для уточнения или null"
      }
      
      Текущая дата: %s

    # Промпт для передачи данных агенту-валидатору
    judge-user-prompt: |
      Исходный запрос пользователя:
      %s
      
      Ответ агента-парсера:
      %s
      
      Проверь корректность и полноту извлеченных данных.
      Верни результат в формате JSON.
