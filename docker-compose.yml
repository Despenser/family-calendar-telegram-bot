
services:
  # PostgreSQL база данных
  postgres:
    image: postgres:18.1-alpine
    container_name: family-calendar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: family_calendar
      POSTGRES_USER: botuser
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme}
      # Явно указываем директорию данных для совместимости с volume
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # Персистентное хранилище данных PostgreSQL
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      - family-calendar-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botuser -d family_calendar"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Spring Boot приложение
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: family-calendar-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # Персистентное хранилище логов
      - app_logs:/app/logs
    environment:
      # Конфигурация базы данных
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/family_calendar
      SPRING_DATASOURCE_USERNAME: botuser
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-changeme}
      
      # Конфигурация Telegram бота
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_BOT_USERNAME: ${TELEGRAM_BOT_USERNAME:-FamilyCalendarBot}
      TELEGRAM_BOT_WEBHOOK_URL: ${TELEGRAM_BOT_WEBHOOK_URL}
      
      # Secret token для webhook
      APP_WEBHOOK_SECRET_TOKEN: ${TELEGRAM_BOT_WEBHOOK_SECRET_TOKEN:-}
      
      # Конфигурация GigaChat AI
      GIGACHAT_API_KEY: ${GIGACHAT_API_KEY}
      GIGACHAT_API_SCOPE: ${GIGACHAT_API_SCOPE:-GIGACHAT_API_PERS}
      GIGACHAT_MODEL: ${GIGACHAT_MODEL:-GigaChat-Max}
      GIGACHAT_TEMPERATURE: ${GIGACHAT_TEMPERATURE:-0.3}
      GIGACHAT_MAX_TOKENS: ${GIGACHAT_MAX_TOKENS:-1024}
      
      # Spring профиль
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      
      # JPA и Flyway настройки
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_FLYWAY_ENABLED: "true"
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
    ports:
      # В dev режиме пробрасываем порт для ngrok, в prod доступ через nginx
      - "${SERVER_PORT:-8080}:8080"
    networks:
      - family-calendar-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx reverse proxy для HTTPS (только для prod)
  nginx:
    image: nginx:1.27-alpine
    container_name: family-calendar-nginx
    restart: unless-stopped
    profiles:
      - prod
    depends_on:
      app:
        condition: service_healthy
    volumes:
      # Конфигурация nginx
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # SSL сертификаты (должны быть размещены в ./nginx/ssl/)
      - ./nginx/ssl:/etc/nginx/ssl:ro
      # Логи nginx
      - nginx_logs:/var/log/nginx
    ports:
      # HTTPS для Telegram webhook
      - "8443:443"
    networks:
      - family-calendar-network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# Volumes для персистентности данных
volumes:
  postgres_data:
    driver: local
    name: family-calendar-postgres-data
  app_logs:
    driver: local
    name: family-calendar-app-logs
  nginx_logs:
    driver: local
    name: family-calendar-nginx-logs

# Сеть для изоляции сервисов
networks:
  family-calendar-network:
    driver: bridge
    name: family-calendar-network
